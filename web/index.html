<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProtoShade</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="min-h-screen bg-neutral-900 text-neutral-100 flex flex-col items-center justify-center gap-6 font-mono">
  <h1 class="text-2xl tracking-widest uppercase">ProtoShade</h1>
  <canvas id="c" width="8" height="8" class="w-80 h-80 [image-rendering:pixelated] rounded ring-1 ring-neutral-700"></canvas>
  <p class="text-sm text-neutral-400">ProtoShade-Runtime, compiled to wasm.</p>
  <!-- Classic script, not bundled: litegraph's IIFEs end in })(this) to reach the global
       object, and inside an ES module top-level this is undefined. Module scripts are
       deferred, so main.js always runs after this one. -->
  <script src="./vendor/litegraph.min.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
